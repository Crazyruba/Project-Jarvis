name: tests

on:
  # Alleen main bij een push: een branch met een open pull request zou anders
  # twee keer dezelfde commit draaien.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Een nieuwe push maakt de vorige draai overbodig.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Oudste ondersteunde versie en de nieuwste.
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Afhankelijkheden installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests draaien
        # Een hangende test faalt na een minuut in plaats van de hele job op
        # te houden; dat is hier eerder misgegaan.
        run: pytest -q --timeout=60

  frontend:
    name: HUD-javascript
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax van de HUD-scripts
        # Alleen onze eigen scripts; three.js is meegeleverd en niet van ons.
        run: |
          for f in hud/static/js/*.js; do
            echo "  $f"
            node --check "$f"
          done

      - name: Verwijzingen in index.html bestaan ook echt
        # Vangt een vergeten bestand, en ook een three.js die niet is
        # meegecommit — de importmap wijst daarnaar.
        run: |
          ontbreekt=0
          paden=$(grep -oE '"/static/[^"]+"' hud/static/index.html \
                  | tr -d '"' | sed 's|^/static/||' | sort -u)
          for pad in $paden; do
            if [ -f "hud/static/$pad" ]; then
              echo "  ✓ $pad"
            else
              echo "  ✗ $pad ontbreekt"; ontbreekt=1
            fi
          done
          exit $ontbreekt
