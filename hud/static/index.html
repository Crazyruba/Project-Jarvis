<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S</title>
<link rel="stylesheet" href="/static/css/hud.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='none' stroke='%2366e8ff' stroke-width='2'/><circle cx='16' cy='16' r='3' fill='%2366e8ff'/></svg>">
<script type="importmap">
{ "imports": { "three": "/static/vendor/three.module.min.js" } }
</script>
</head>
<body>

<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>

<!-- statuspaneel linksboven -->
<section class="status-panel" aria-label="Status">
  <div class="status-row" data-state="idle">
    <span class="dot"></span><span class="label">ONLINE</span>
    <span class="note" id="conn-note">verbinden…</span>
  </div>
  <div class="status-row" data-state="listening">
    <span class="dot"></span><span class="label">LUISTERT</span>
  </div>
  <div class="status-row" data-state="thinking">
    <span class="dot"></span><span class="label">DENKT</span>
  </div>
  <div class="status-row" data-state="speaking">
    <span class="dot"></span><span class="label">SPREEKT</span>
  </div>
</section>

<!-- titel bovenaan -->
<header class="titlebar">
  <h1 id="hud-title">J . A . R . V . I . S</h1>
  <p id="hud-subtitle">OPENCLAW HOLO-INTERFACE</p>
</header>

<!-- tandwiel rechtsboven -->
<button class="gear" id="gear" aria-label="Instellingen" aria-expanded="false">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
    <path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.5 7.5 0 0 0-1.7-1l-.4-2.6h-3.8l-.4 2.6a7.5 7.5 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.8 1.7 1l.4 2.6h3.8l.4-2.6c.6-.2 1.2-.6 1.7-1l2.4 1 2-3.4zM12 15a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
  </svg>
</button>

<aside class="panel" id="panel" hidden>
  <h2>Instellingen</h2>

  <label class="field">
    <span>Brein</span>
    <select id="backend-select"></select>
  </label>

  <div class="health" id="health">
    <button class="link" id="health-check" type="button">Backends testen</button>
    <ul id="health-list"></ul>
  </div>

  <label class="field inline">
    <input type="checkbox" id="lite-toggle">
    <span>Lite-modus <small>(minder effecten, scheelt accu)</small></span>
  </label>

  <p class="hint">
    <kbd>/</kbd> invoerveld · <kbd>Esc</kbd> afbreken · <kbd>spatie</kbd> praten
  </p>
</aside>

<!-- gesprek onderaan -->
<footer class="console">
  <div class="transcript" id="transcript" aria-live="polite">
    <span class="who">JARVIS</span>
    <span class="said" id="subtitle">Verbinding maken…</span>
  </div>

  <form class="composer" id="composer">
    <input id="input" type="text" autocomplete="off" spellcheck="false"
           placeholder="Typ een bericht, of houd spatie ingedrukt om te praten">
    <button type="button" id="mic" class="mic" aria-label="Spreken">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/>
        <path fill="currentColor" d="M17 11a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/>
      </svg>
    </button>
  </form>

  <p class="toast" id="toast" hidden></p>
</footer>

<script type="module" src="/static/js/holo.js"></script>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
