[pytest]
# De projectmodules (config, core, hud, …) staan in de wortel van de repo.
# Zonder dit werkt `python -m pytest` wel (die zet de werkmap op sys.path)
# maar het kale `pytest`-commando niet.
pythonpath = .

testpaths = tests

# Een hangende test moet falen, niet blijven draaien. Dat is hier echt
# gebeurd: twee tests bleven oneindig op een WebSocket-bericht wachten.
timeout = 60

addopts = -q
